<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Talkthrough overlay</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src file: data:">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { position: relative; user-select: none; -webkit-user-select: none; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  body.dragging { cursor: grabbing; }
  #backdrop { -webkit-user-drag: none; position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: fill; display: none; }
  /* The optional box behind the 3D stage; it never takes the pointer. */
  #panel {
    position: absolute; display: none; box-sizing: border-box; pointer-events: none;
    background: rgba(14, 20, 34, 0.96); border: 2px solid rgba(255, 255, 255, 0.28); border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }
  canvas { position: absolute; left: 0; top: 0; pointer-events: none; }

  /* What the app says about itself: listening, working, an offer and a notice. */
  #status { position: absolute; right: 22px; bottom: 22px; display: none; align-items: center; gap: 9px; pointer-events: none;
    padding: 8px 14px 8px 12px; border-radius: 999px; background: rgba(17, 22, 34, 0.82); color: #e8eef9; font-size: 13px; font-weight: 600; letter-spacing: 0.01em; }
  #status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #ff6b6b; animation: pulse 1.3s ease-in-out infinite; }
  #status.listening::after { content: "Listening"; }
  #status.working::before { background: #7cc4ff; }
  #status.working::after { content: "Thinking"; }
  #status.backend::before { background: #b69cff; }
  #status.backend::after { content: "With the backend"; }
  @keyframes pulse { 0%, 100% { transform: scale(0.8); opacity: 0.65; } 50% { transform: scale(1.15); opacity: 1; } }
  #offer { position: absolute; right: 22px; bottom: 70px; display: none; align-items: center; gap: 14px; max-width: 460px; pointer-events: auto;
    padding: 12px 14px 12px 16px; border-radius: 14px; background: rgba(17, 22, 34, 0.94); color: #eef3fb; font-size: 14px; line-height: 1.35;
    border: 1px solid rgba(255, 255, 255, 0.16); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
  #offer button { flex: none; font: inherit; font-weight: 650; color: #0d1320; background: #7cc4ff; border: 0; border-radius: 9px; padding: 7px 14px; cursor: pointer; }
  #offer button:hover { background: #a3d6ff; }
  /* The Explode / Assemble control that sits at the corner of a finished 3D model. */
  #explode { position: absolute; display: none; pointer-events: auto; font: inherit; font-size: 12.5px; font-weight: 650; letter-spacing: 0.01em;
    color: #e8eef9; background: rgba(17, 22, 34, 0.9); border: 1px solid rgba(255, 255, 255, 0.24); border-radius: 999px; padding: 5px 13px; cursor: pointer; }
  #explode:hover { background: rgba(38, 50, 78, 0.97); border-color: rgba(255, 255, 255, 0.4); }
  #notice { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: none; pointer-events: auto; max-width: 560px;
    padding: 9px 16px; border-radius: 999px; background: rgba(17, 22, 34, 0.92); color: #eef3fb; font-size: 13.5px; font-weight: 500; cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.14); }
  #notice.error { background: rgba(86, 24, 32, 0.95); border-color: rgba(255, 130, 140, 0.5); }
</style>
</head>
<body>
<img id="backdrop" alt="">
<div id="panel"></div>
<canvas id="gl"></canvas>
<canvas id="marks"></canvas>
<div id="status"></div>
<div id="offer"><span id="offer-text"></span><button id="offer-button" type="button">Ask</button></div>
<button id="explode" type="button" title="Spread the parts apart (E)">Explode</button>
<div id="notice"></div>
<script src="./overlay.js"></script>
</body>
</html>
