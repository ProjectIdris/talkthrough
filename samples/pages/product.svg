  </g>
  <rect x="1630" y="30" width="140" height="48" rx="6" fill="#6fcf4f"/>
  <text x="1700" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">Buy now</text>
